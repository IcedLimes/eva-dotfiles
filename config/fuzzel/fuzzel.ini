# Fuzzel (power menu, clipboard history, shortcut list).
# Colors come from the active theme (eva-theme rewrites that file).
include=~/.config/eva/current/fuzzel.ini

[main]
font=Inter:size=11
prompt="  "
terminal=alacritty -e
layer=overlay
anchor=bottom-left
x-margin=10
y-margin=66
width=34
lines=10
horizontal-pad=16
vertical-pad=14
inner-pad=10
line-height=26
icons-enabled=yes
icon-theme=Papirus-Dark

[border]
width=1
radius=14
selection-radius=8
