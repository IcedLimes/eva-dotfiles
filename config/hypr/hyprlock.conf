# Lock screen, macOS-style: blurred wallpaper, date over a large clock,
# a pill password field at the bottom. Colors come from the active theme.
source = ~/.config/eva/current/hyprlock.conf

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = decel, 0.05, 0.7, 0.1, 1
    animation = fadeIn, 1, 4, decel
    animation = fadeOut, 1, 3, decel
    animation = inputFieldDots, 1, 2, decel
}

background {
    monitor =
    path = ~/Pictures/wallpapers/eva01-mono-flipped.png
    color = $bg
    blur_passes = 3
    blur_size = 8
    noise = 0.02
    brightness = 0.55
    vibrancy = 0.2
}

# Date, then the clock
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %-d"
    color = rgba(e8ddd0d9)
    font_size = 24
    font_family = Inter Medium
    position = 0, 440
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(f2ece4f2)
    font_size = 136
    font_family = Inter SemiBold
    position = 0, 320
    halign = center
    valign = center
}

# Small EVA mark under the clock
label {
    monitor =
    text = $unit
    color = $primary
    font_size = 20
    font_family = Noto Serif CJK JP Black
    position = 0, 196
    halign = center
    valign = center
}

# Avatar (NERV logo), user name, password pill
label {
    monitor =
    text = 
    color = $primary
    font_size = 54
    font_family = nerv
    position = 0, -470
    halign = center
    valign = center
}

label {
    monitor =
    text = $USER
    color = rgba(e8ddd0e6)
    font_size = 15
    font_family = Inter SemiBold
    position = 0, -540
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 280, 40
    outline_thickness = 1
    rounding = -1
    inner_color = rgba(ffffff1f)
    outer_color = rgba(ffffff26)
    check_color = $glow
    fail_color = $crit
    font_color = rgba(f2ece4ff)
    font_family = Inter
    fade_on_empty = false
    placeholder_text = <span foreground="##e8ddd099">Enter password</span>
    check_text = Unlocking…
    fail_text = Incorrect password
    dots_size = 0.22
    dots_spacing = 0.35
    position = 0, -600
    halign = center
    valign = center
}
