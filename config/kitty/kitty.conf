# EVA kitty (Hyprland). Colors follow the EVA theme: eva-theme writes them to
# ~/.config/eva/current/kitty.conf and tells kitty to reload on theme switches.

font_family      JetBrains Mono
font_size        11.0

# The text cursor glides to its new spot (e.g. a new line) with a short trail.
cursor_trail               3
cursor_trail_decay         0.1 0.35
cursor_trail_start_threshold 2
cursor_shape               block
cursor_blink_interval      0.6

# See-through background like the EVA Konsole profile; Hyprland frosts it.
background_opacity 0.75

# Hyprland draws the title bar.
hide_window_decorations yes
window_padding_width    8 10

# Tabs like Konsole's: always shown, along the top, in the EVA colors (set by
# eva-theme). Ctrl+Shift+T opens one in the same folder, Ctrl+Shift+Left/Right
# or Ctrl+Tab switches, Ctrl+Shift+Q closes.
tab_bar_edge            top
tab_bar_min_tabs        1
tab_bar_style           separator
tab_separator           " "
tab_title_template      " {index}  {title} "
tab_title_max_length    32
tab_bar_margin_width    8
tab_bar_margin_height   6 2
active_tab_font_style   bold
inactive_tab_font_style normal
map ctrl+shift+t new_tab_with_cwd

confirm_os_window_close 0
enable_audio_bell       no
remember_window_size    no
initial_window_width    110c
initial_window_height   32c
scrollback_lines        10000
copy_on_select          no
url_style               curly

include ~/.config/eva/current/kitty.conf
