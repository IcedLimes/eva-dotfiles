# Closing the lid suspends: on battery, on AC, and even when logind thinks the
# laptop is docked (by default it then ignores the lid, and some dGPU drivers
# make it think so with nothing plugged in). No clamshell mode.
# Desktop environments that handle the lid themselves (Plasma's PowerDevil)
# take over while they run; this applies in Hyprland, at the login screen
# and on a TTY.
[Login]
HandleLidSwitch=suspend
HandleLidSwitchExternalPower=suspend
HandleLidSwitchDocked=suspend
